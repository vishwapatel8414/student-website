<!DOCTYPE html>
<html>

<head>
  <title>Student Website</title>

  <style>
    

    body{
      margin:0;
      padding:0;
      font-family:Arial;
      background:#f3e8ff;
      text-align:center;
    }

    .navbar{
      background:purple;
      padding:20px;
      color:white;
      font-size:28px;
      font-weight:bold;
    }

    .container{
      padding:50px;
    }

    img{
      width:180px;
      border-radius:50%;
      margin-top:20px;
    }

    h1{
      color:purple;
      font-size:45px;
    }

    p{
      font-size:22px;
    }

    .skills{
      margin-top:30px;
    }

    .skill-box{
      background:white;
      margin:10px auto;
      width:250px;
      padding:15px;
      border-radius:10px;
      box-shadow:0 0 10px lightgray;
    }

    button{
      background:black;
      color:white;
      padding:15px 25px;
      border:none;
      border-radius:10px;
      font-size:18px;
      margin-top:30px;
      cursor:pointer;
    }

    button:hover{
      background:purple;
    }

  </style>
</head>

<body>

  <div class="navbar">
    My Student Website
  </div>

  <div class="container">

    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

    <h1>Hello, I am Vishwa 👋</h1>

    <p>
      I am a Computer Engineering Student.
      This is my first website.
    </p>

    <div class="skills">

      <h2>My Skills</h2>

      <div class="skill-box">HTML</div>

      <div class="skill-box">CSS</div>

      <div class="skill-box">GitHub</div>

      <div class="skill-box">VS Code</div>

    </div>

    <button>
      Contact Me
    </button>

  </div>

</body>
<div class="navbar">
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Skills</a>
  <a href="#">Contact</a>
</div>


</html>
